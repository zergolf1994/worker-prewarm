<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prewarm — Live</title>
<style>
  :root { --bg:#0b0e14; --card:#141821; --border:#232a38; --text:#e6e9f0; --dim:#8b93a7;
          --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; padding:20px; }
  h1 { font-size:16px; display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  h1 .dot { width:8px; height:8px; border-radius:50%; background:var(--red); }
  h1 .dot.on { background:var(--green); box-shadow:0 0 8px var(--green); }
  h1 small { color:var(--dim); font-weight:normal; }
  .jobs { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; margin-bottom:20px; }
  .job { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; }
  .job .top { display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .job .slug { color:var(--blue); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .job .tag { color:var(--dim); font-size:12px; white-space:nowrap; }
  .bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:8px 0 4px; }
  .bar i { display:block; height:100%; background:var(--green); width:0%; transition:width .2s; }
  .job .pct { color:var(--dim); font-size:12px; text-align:right; }
  .empty { color:var(--dim); padding:30px 0; text-align:center; }
  h2 { font-size:13px; color:var(--dim); margin:16px 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:3px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td.url { max-width:340px; overflow:hidden; text-overflow:ellipsis; }
  .HIT { color:var(--green); } .MISS { color:var(--amber); } .EXPIRED { color:var(--blue); }
  .ERR, .NONE { color:var(--red); }
  .dim { color:var(--dim); }
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span> Prewarm <small id="sub">connecting…</small></h1>

<div class="jobs" id="jobs"></div>
<div class="empty" id="empty">ไม่มีงานกำลัง prewarm</div>

<h2>Live results</h2>
<table><tbody id="feed"></tbody></table>

<script>
const jobsEl = document.getElementById("jobs");
const feedEl = document.getElementById("feed");
const emptyEl = document.getElementById("empty");
const dot = document.getElementById("dot");
const sub = document.getElementById("sub");
const jobs = new Map(); // id -> element
const MAX_FEED = 60;

function jobKey(j){ return j.id; }
function jobCard(j){
  const el = document.createElement("div");
  el.className = "job";
  el.innerHTML = `
    <div class="top"><span class="slug"></span><span class="tag"></span></div>
    <div class="bar"><i></i></div>
    <div class="pct">0 / ?</div>`;
  update(el, j);
  return el;
}
function update(el, j){
  el.querySelector(".slug").textContent = j.fileSlug || j.mediaSlug || "-";
  el.querySelector(".tag").textContent = `${j.resolution || "-"} · ${j.kind || "new"} · ${(j.pop || "").toUpperCase()}`;
  updateProgress(el, j.progress, j.total);
}
function updateProgress(el, progress, total){
  const pct = total > 0 ? Math.round(progress / total * 100) : 0;
  el.querySelector(".bar i").style.width = pct + "%";
  el.querySelector(".pct").textContent = total > 0 ? `${progress} / ${total} (${pct}%)` : "…";
}
function upsert(j){
  if (!j || !j.id) return;
  let el = jobs.get(j.id);
  if (!el){ el = jobCard(j); jobs.set(j.id, el); jobsEl.appendChild(el); }
  else update(el, j);
  emptyEl.style.display = jobs.size ? "none" : "";
}
function remove(id){
  const el = jobs.get(id);
  if (el){ el.remove(); jobs.delete(id); }
  emptyEl.style.display = jobs.size ? "none" : "";
}
function feed(r){
  const tr = document.createElement("tr");
  const cls = r.error ? "ERR" : (r.cache || "NONE");
  tr.innerHTML = `
    <td class="dim"></td><td class="url"></td>
    <td class="${cls}"></td><td class="dim"></td><td class="dim"></td>`;
  const tds = tr.children;
  tds[0].textContent = r.mediaSlug || "";
  tds[1].textContent = r.url || "";
  tds[2].textContent = r.error ? "ERR" : (r.cache || String(r.status));
  tds[3].textContent = r.duration || "";
  tds[4].textContent = r.total ? `${r.progress}/${r.total}` : "";
  feedEl.prepend(tr);
  while (feedEl.children.length > MAX_FEED) feedEl.lastChild.remove();
}

function connect(){
  const es = new EventSource("/events");
  es.onopen = () => { dot.classList.add("on"); sub.textContent = "live"; };
  es.onerror = () => { dot.classList.remove("on"); sub.textContent = "reconnecting…"; };
  es.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "snapshot"){ jobsEl.innerHTML = ""; jobs.clear(); (m.data || []).forEach(upsert); emptyEl.style.display = jobs.size ? "none" : ""; }
    else if (m.type === "job_start"){ upsert(m.data); }
    else if (m.type === "url_result"){
      feed(m.data);
      const el = jobs.get(m.data.jobId);
      if (el) updateProgress(el, m.data.progress, m.data.total);
    }
    else if (m.type === "job_complete"){ if (m.data && m.data.job) remove(m.data.job.id); }
  };
}
connect();
</script>
</body>
</html>
