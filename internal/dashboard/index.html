<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prewarm — Live</title>
<style>
  :root { --bg:#0b0e14; --card:#141821; --card2:#0f131b; --border:#232a38; --text:#e6e9f0; --dim:#8b93a7;
          --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; padding:20px; }
  h1 { font-size:16px; display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  h1 .dot { width:8px; height:8px; border-radius:50%; background:var(--red); }
  h1 .dot.on { background:var(--green); box-shadow:0 0 8px var(--green); }
  h1 small { color:var(--dim); font-weight:normal; }
  .jobs { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; align-items:start; }
  .job { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; cursor:pointer; }
  .job:hover { border-color:#33405a; }
  .job .top { display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; align-items:center; }
  .job .slug { color:var(--blue); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .job .tag { color:var(--dim); font-size:12px; white-space:nowrap; }
  .job .chev { color:var(--dim); font-size:11px; transition:transform .15s; }
  .job.open .chev { transform:rotate(90deg); }
  .bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:8px 0 4px; }
  .bar i { display:block; height:100%; background:var(--green); width:0%; transition:width .2s; }
  .meta { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
  .meta .hm b { font-weight:normal; }
  .HIT { color:var(--green); } .MISS { color:var(--amber); } .EXPIRED { color:var(--blue); }
  .ERR, .NONE { color:var(--red); }
  .log { display:none; margin-top:10px; border-top:1px solid var(--border); padding-top:8px;
         background:var(--card2); border-radius:6px; padding:8px 10px; max-height:220px; overflow-y:auto;
         font-size:11.5px; line-height:1.7; }
  .job.open .log { display:block; }
  .log div { display:flex; gap:8px; white-space:nowrap; }
  .log .u { flex:1; overflow:hidden; text-overflow:ellipsis; color:var(--text); }
  .log .d { color:var(--dim); }
  .empty { color:var(--dim); padding:30px 0; text-align:center; }
  .hint { color:var(--dim); font-size:12px; margin-bottom:10px; }
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span> Prewarm <small id="sub">connecting…</small></h1>
<p class="hint">กดการ์ดเพื่อดู URL log ของงานนั้น</p>

<div class="jobs" id="jobs"></div>
<div class="empty" id="empty">ไม่มีงานกำลัง prewarm</div>

<script>
const jobsEl = document.getElementById("jobs");
const emptyEl = document.getElementById("empty");
const dot = document.getElementById("dot");
const sub = document.getElementById("sub");
const jobs = new Map();   // id -> {el, hit, miss, fail}
const MAX_LOG = 100;      // แถว log ต่อการ์ด

function jobCard(j){
  const el = document.createElement("div");
  el.className = "job";
  el.innerHTML = `
    <div class="top"><span class="slug"></span><span class="tag"></span><span class="chev">▶</span></div>
    <div class="bar"><i></i></div>
    <div class="meta"><span class="pct">0 / ?</span><span class="hm"></span></div>
    <div class="log"></div>`;
  el.addEventListener("click", (e) => {
    if (e.target.closest(".log")) return; // เลื่อนอ่าน log ไม่นับเป็นกดปิด
    el.classList.toggle("open");
  });
  updateMeta(el, j);
  return el;
}
function updateMeta(el, j){
  el.querySelector(".slug").textContent = j.fileSlug || j.mediaSlug || "-";
  el.querySelector(".tag").textContent = `${j.resolution || "-"} · ${j.kind || "new"} · ${(j.pop || "").toUpperCase()}`;
  updateProgress(el, j.progress, j.total);
}
function updateProgress(el, progress, total){
  const pct = total > 0 ? Math.round(progress / total * 100) : 0;
  el.querySelector(".bar i").style.width = pct + "%";
  el.querySelector(".pct").textContent = total > 0 ? `${progress} / ${total} (${pct}%)` : "…";
}
function updateCounts(rec){
  rec.el.querySelector(".hm").innerHTML =
    `<b class="HIT">H ${rec.hit}</b> · <b class="MISS">M ${rec.miss}</b>` +
    (rec.fail ? ` · <b class="ERR">F ${rec.fail}</b>` : "");
}
function upsert(j){
  if (!j || !j.id) return;
  let rec = jobs.get(j.id);
  if (!rec){
    rec = { el: jobCard(j), hit: 0, miss: 0, fail: 0 };
    jobs.set(j.id, rec);
    jobsEl.appendChild(rec.el);
  } else updateMeta(rec.el, j);
  emptyEl.style.display = jobs.size ? "none" : "";
}
function remove(id){
  const rec = jobs.get(id);
  if (rec){ rec.el.remove(); jobs.delete(id); }
  emptyEl.style.display = jobs.size ? "none" : "";
}
function onResult(r){
  const rec = jobs.get(r.jobId);
  if (!rec) return;
  updateProgress(rec.el, r.progress, r.total);

  const cls = r.error ? "ERR" : (r.cache || "NONE");
  if (cls === "HIT" || cls === "REVALIDATED") rec.hit++;
  else if (r.error || (r.status !== 200 && r.status !== 206)) rec.fail++;
  else rec.miss++;
  updateCounts(rec);

  const log = rec.el.querySelector(".log");
  const row = document.createElement("div");
  row.innerHTML = `<span class="${cls}">${r.error ? "ERR " : (r.cache || r.status)}</span>` +
    `<span class="u"></span><span class="d"></span>`;
  row.querySelector(".u").textContent = r.url || "";
  row.querySelector(".d").textContent = r.duration || "";
  log.prepend(row);
  while (log.children.length > MAX_LOG) log.lastChild.remove();
}

function connect(){
  const es = new EventSource("/events");
  es.onopen = () => { dot.classList.add("on"); sub.textContent = "live"; };
  es.onerror = () => { dot.classList.remove("on"); sub.textContent = "reconnecting…"; };
  es.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "snapshot"){
      jobsEl.innerHTML = ""; jobs.clear();
      (m.data || []).forEach(upsert);
      emptyEl.style.display = jobs.size ? "none" : "";
    }
    else if (m.type === "job_start"){ upsert(m.data); }
    else if (m.type === "url_result"){ onResult(m.data); }
    else if (m.type === "job_complete"){ if (m.data && m.data.job) remove(m.data.job.id); }
  };
}
connect();
</script>
</body>
</html>
